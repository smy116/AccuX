name: Build AccuX

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: 正式版本号（不带 v 前缀），例如 1.7 或 1.7.0。留空时按分支构建计算 CI 版本。
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 显示版本
        value: ${{ jobs.prepare.outputs.version }}
      installer_version:
        description: 安装器数字版本
        value: ${{ jobs.prepare.outputs.installer_version }}
      assembly_version:
        description: 程序集版本
        value: ${{ jobs.prepare.outputs.assembly_version }}
      file_version:
        description: 文件版本
        value: ${{ jobs.prepare.outputs.file_version }}
      output_base_filename:
        description: 安装包基础文件名
        value: ${{ jobs.prepare.outputs.output_base_filename }}
      setup_filename:
        description: 安装包文件名
        value: ${{ jobs.prepare.outputs.setup_filename }}
      checksum_filename:
        description: SHA-256 校验文件名
        value: ${{ jobs.prepare.outputs.checksum_filename }}
      manifest_filename:
        description: manifest 文件名
        value: ${{ jobs.prepare.outputs.manifest_filename }}

permissions:
  contents: read

concurrency:
  group: accux-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_version: ${{ steps.version.outputs.installer_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      output_base_filename: ${{ steps.version.outputs.output_base_filename }}
      setup_filename: ${{ steps.version.outputs.setup_filename }}
      checksum_filename: ${{ steps.version.outputs.checksum_filename }}
      manifest_filename: ${{ steps.version.outputs.manifest_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate build version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 语义版本 -> CLR 四段版本：1.6 -> 1.6.0.0，1.6.1 -> 1.6.1.0。
          function Get-FourPartVersion {
            param([Parameter(Mandatory)][string]$Value)
            $numeric = $Value.Split('-')[0].Split('.')
            $patch = if ($numeric.Length -ge 3) { $numeric[2] } else { '0' }
            return "$($numeric[0]).$($numeric[1]).$patch.0"
          }

          function Assert-VersionSegment {
            param([Parameter(Mandatory)][string]$Value)
            foreach ($part in $Value.Split('.')) {
              if ([int64]$part -gt 65534) { throw "版本段必须在 0 到 65534 之间：$Value" }
            }
          }

          # 已发布的稳定版本取仓库里最高的 vM.m[.p] tag。
          function Get-LatestStableVersion {
            $versions = @()
            foreach ($tag in (& git tag --list 'v*')) {
              if ($tag -match '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?$') {
                $versions += [pscustomobject]@{
                  Major = [int64]$Matches[1]
                  Minor = [int64]$Matches[2]
                  Patch = if ($Matches[3]) { [int64]$Matches[3] } else { [int64]0 }
                }
              }
            }
            return ($versions | Sort-Object Major, Minor, Patch | Select-Object -Last 1)
          }

          # 正式版本号有两个来源：release 工作流入参（纯数字版本），
          # 或手动对 tag 触发本工作流时的 tag ref（带 v 前缀）。
          $releaseVersion = $null
          if ($env:RELEASE_VERSION) {
            $candidate = $env:RELEASE_VERSION.Trim()
            if ($candidate -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?$') {
              throw "非法发布版本号 '$candidate'：必须是 主版本.次版本 或 主版本.次版本.修订号（例如 1.7 或 1.7.0），不接受 v 前缀、四段版本或预发布后缀。"
            }
            $releaseVersion = $candidate
          }
          elseif ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?$') {
              throw "非法版本 tag '$($env:REF_NAME)'。正式版本必须是 v主版本.次版本 或 v主版本.次版本.修订号，例如 v1.6 或 v1.6.1。"
            }
            $releaseVersion = (@($Matches[1], $Matches[2], $Matches[3]) | Where-Object { $_ }) -join '.'
          }

          if ($releaseVersion) {
            Assert-VersionSegment -Value $releaseVersion

            $version = $releaseVersion
            $assemblyVersion = Get-FourPartVersion -Value $version
            $fileVersion = $assemblyVersion
            $installerVersion = $version
            $outputBaseFilename = "AccuXSetup-$version"
          }
          else {
            $shortSha = $env:COMMIT_SHA.Substring(0, 7)
            $latest = Get-LatestStableVersion
            if ($latest) {
              $major = $latest.Major
              $minor = $latest.Minor
              $nextPatch = $latest.Patch + 1
            }
            else {
              $major = 0
              $minor = 0
              $nextPatch = 1
            }

            # FileVersion 第四段用构建号，保证每次 CI 构建版本都不同。
            if ($env:RUN_NUMBER -gt 65534) {
              throw "构建号 $($env:RUN_NUMBER) 超出文件版本第四段上限（65534），请先发布一个正式版本来重置编号。"
            }

            $baseVersion = "$major.$minor.$nextPatch"
            $version = "$baseVersion-ci.$($env:RUN_NUMBER).$shortSha"
            # AssemblyVersion 只在正式发布时前移：测试版沿用已发布版本，
            # 避免开发中途改变 CLR 绑定标识。
            $assemblyVersion = if ($latest) { "$major.$minor.$($latest.Patch).0" } else { '0.0.0.0' }
            $fileVersion = "$major.$minor.$nextPatch.$($env:RUN_NUMBER)"
            $installerVersion = $baseVersion
            $outputBaseFilename = "AccuXSetup-$version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "installer_version=$installerVersion" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "output_base_filename=$outputBaseFilename" >> $env:GITHUB_OUTPUT
          "setup_filename=$outputBaseFilename.exe" >> $env:GITHUB_OUTPUT
          "checksum_filename=$outputBaseFilename.exe.sha256" >> $env:GITHUB_OUTPUT
          "manifest_filename=$outputBaseFilename.exe.manifest.json" >> $env:GITHUB_OUTPUT

          Write-Host "显示版本：$version；安装器版本：$installerVersion；程序集版本：$assemblyVersion；文件版本：$fileVersion"

  build:
    name: Build installer
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' `
            -OutFile $installerPath
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup 下载校验失败，实际 SHA-256 为 $actualHash。"
          }

          $install = Start-Process -FilePath $installerPath `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup 安装失败，退出码 $($install.ExitCode)。"
          }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "未找到 ISCC.exe：$iscc"
          }
          $versionKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          )
          $actualVersion = $null
          foreach ($versionKey in $versionKeys) {
            if (Test-Path -LiteralPath $versionKey) {
              $actualVersion = (Get-ItemProperty -LiteralPath $versionKey).DisplayVersion
              break
            }
          }
          if ($actualVersion -ne '6.7.3') {
            throw "ISCC 版本不符合要求，期望 6.7.3，实际为 $actualVersion。"
          }

          "ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "使用 Inno Setup $actualVersion。"

      - name: Locate Office 15 PIA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15'),
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) }

          $piaNames = @('Microsoft.Office.Interop.Excel.dll', 'Office.dll', 'Microsoft.Vbe.Interop.dll')
          $piaPath = $null
          foreach ($candidate in $candidates) {
            $files = $piaNames | ForEach-Object { Join-Path $candidate $_ }
            if (($files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }).Count -eq 0) {
              foreach ($file in $files) {
                $version = [Reflection.AssemblyName]::GetAssemblyName($file).Version.ToString()
                if ($version -ne '15.0.0.0') {
                  throw "Office PIA 必须是 15.0.0.0：$file 实际为 $version"
                }
              }
              $piaPath = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }

          if ($piaPath) {
            "OfficePiaPath=$piaPath" >> $env:GITHUB_ENV
            Write-Host "使用 Office PIA：$piaPath"
          }
          else {
            Write-Host '未找到 Visual Studio Office15 PIA，将由 build.ps1 检查并使用 GAC 兼容路径。'
          }

      - name: Build, test, and validate dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./build.ps1 `
            -Configuration Release `
            -Version '${{ needs.prepare.outputs.version }}' `
            -AssemblyVersion '${{ needs.prepare.outputs.assembly_version }}' `
            -FileVersion '${{ needs.prepare.outputs.file_version }}' `
            -OfficePiaPath $env:OfficePiaPath
          if ($LASTEXITCODE -ne 0) { throw 'AccuX 构建或测试失败。' }

      - name: Validate installer transaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./installer/Test-Installer.ps1 `
            -Iscc $env:ISCC `
            -Version '${{ needs.prepare.outputs.version }}' `
            -FileVersion '${{ needs.prepare.outputs.file_version }}'
          if ($LASTEXITCODE -ne 0) { throw '安装器回归测试失败。' }

      - name: Compile installer
        shell: pwsh
        env:
          ACCUX_ARTIFACT_DIRECTORY: ${{ runner.temp }}\accux-artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:ACCUX_ARTIFACT_DIRECTORY -Force | Out-Null
          & ./installer/Build-Installer.ps1 `
            -Iscc $env:ISCC `
            -Version '${{ needs.prepare.outputs.version }}' `
            -InstallerVersion '${{ needs.prepare.outputs.installer_version }}' `
            -FileVersion '${{ needs.prepare.outputs.file_version }}' `
            -OutputDirectory $env:ACCUX_ARTIFACT_DIRECTORY `
            -OutputBaseFilename '${{ needs.prepare.outputs.output_base_filename }}' `
            -CommitSha '${{ github.sha }}' `
            -RunNumber '${{ github.run_number }}'
          if ($LASTEXITCODE -ne 0) { throw '统一安装包构建脚本执行失败。' }

      - name: Upload installer executable artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}\accux-artifacts\${{ needs.prepare.outputs.setup_filename }}
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload installer checksum artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}\accux-artifacts\${{ needs.prepare.outputs.checksum_filename }}
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload installer manifest artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}\accux-artifacts\${{ needs.prepare.outputs.manifest_filename }}
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AccuX-build-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\accux-artifacts\**\*
            ${{ github.workspace }}\installer\Output\**\*.log
            ${{ github.workspace }}\artifacts\**\*
          if-no-files-found: ignore
          retention-days: 30
